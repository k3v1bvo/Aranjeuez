name: Build Android APK (Paseo Aranjuez)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/manifest.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilar APK Android Nativo
        run: |
          echo "Generando APK para Paseo Aranjuez..."
          mkdir -p output
          mkdir -p ~/.bubblewrap

          # Escribir la configuracion exacta de Bubblewrap para que NUNCA pregunte por el JDK ni Android SDK
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          # Generar proyecto respondiendo por defecto 'yes' a cualquier prompt interactivo
          yes "" | npx --yes @bubblewrap/cli init \
            --manifest=https://aranjeuez-xi.vercel.app/manifest.json \
            --directory=./twa-app \
            --skipPwaValidation || true

          # Si por alguna razon bubblewrap falla, compilar directamente con gradlew
          if [ -d "./twa-app" ]; then
            cd twa-app
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/*.apk ../output/PaseoAranjuez-debug.apk
          else
            echo "Directorio twa-app no encontrado, verificando build alternativo..."
          fi

          echo "Compilacion finalizada."

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: PaseoAranjuez-Android-APK
          path: output/*.apk
          if-no-files-found: warn
