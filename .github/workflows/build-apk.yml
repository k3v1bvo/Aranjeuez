name: Build Android APK (Paseo Aranjuez)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/manifest.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar APK Nativo con PWABuilder CLI
        run: |
          echo "Compilando APK de Paseo Aranjuez..."
          mkdir -p output
          # El runner de GitHub Actions ya tiene Android SDK y Gradle preinstalados de fabrica
          # PWABuilder genera directamente el APK firmado para distribucion
          npx --yes @pwabuilder/cli https://aranjeuez-xi.vercel.app -d ./output -p android
          echo "Compilacion finalizada."

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: PaseoAranjuez-Android-APK
          path: output/**/*.apk
          if-no-files-found: warn
