name: Build Android APK (Paseo Aranjuez)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/manifest.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Generar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilar APK desde PWA con PWABuilder Cloud
        run: |
          echo "Iniciando empaquetado nativo de Paseo Aranjuez..."
          mkdir -p output
          # Usar PWABuilder CLI para generar el paquete Android nativo
          npx --yes @pwabuilder/cli https://aranjeuez-xi.vercel.app -d ./output -p android
          echo "Compilacion completada con exito."

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: PaseoAranjuez-Android-APK
          path: output/**/*.apk
          if-no-files-found: warn
