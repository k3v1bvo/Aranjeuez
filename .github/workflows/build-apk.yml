name: Build Android APK (Paseo Aranjuez)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/manifest.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilar APK Android Nativo
        run: |
          echo "Generando APK para Paseo Aranjuez en modo no interactivo..."
          mkdir -p output

          # Configuracion de bubblewrap con variables de entorno para saltar prompts de JDK y Android SDK
          export BUBBLEWRAP_JDK_PATH=$JAVA_HOME
          export BUBBLEWRAP_ANDROID_SDK_PATH=$ANDROID_HOME

          # Bubblewrap CLI con --skipPwaValidation y --yes para CI/CD automatizado
          npx --yes @bubblewrap/cli init \
            --manifest=https://aranjeuez-xi.vercel.app/manifest.json \
            --directory=./twa-app \
            --skipPwaValidation \
            --chromeOSOnly=false

          cd twa-app
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/*.apk ../output/PaseoAranjuez-debug.apk
          echo "Compilacion exitosa de APK."

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: PaseoAranjuez-Android-APK
          path: output/*.apk
          if-no-files-found: error
