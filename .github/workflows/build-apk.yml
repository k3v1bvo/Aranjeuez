name: Build Android APK (Paseo Aranjuez)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/manifest.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compilar APK Android Nativo
        run: |
          echo "Generando APK para Paseo Aranjuez..."
          mkdir -p output
          mkdir -p ~/.bubblewrap

          # Escribir la configuracion exacta de Bubblewrap para que NUNCA pregunte por el JDK ni Android SDK
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF

          # Esperar a que Vercel sirva el manifest actualizado con PsjAranjuez
          echo "Verificando sincronizacion del manifest en Vercel..."
          for i in {1..30}; do
            if curl -sL https://aranjeuez-xi.vercel.app/manifest.json | grep -q "PsjAranjuez"; then
              echo "Manifest actualizado con PsjAranjuez detectado con exito!"
              break
            fi
            echo "Esperando sincronizacion de Vercel..."
            sleep 3
          done

          # Generar proyecto respondiendo por defecto a cualquier prompt interactivo
          yes "" | npx --yes @bubblewrap/cli init \
            --manifest=https://aranjeuez-xi.vercel.app/manifest.json \
            --directory=./twa-app \
            --skipPwaValidation || true

          # Si se genero el proyecto, compilar APK con Gradle
          if [ -d "./twa-app" ]; then
            cd twa-app
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/*.apk ../output/PaseoAranjuez-debug.apk
            echo "APK generado exitosamente."
          else
            echo "Error: twa-app no se pudo generar."
            exit 1
          fi

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: PaseoAranjuez-Android-APK
          path: output/*.apk
          if-no-files-found: error
