name: Build Android APK (Paseo Aranjuez)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public/manifest.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Bubblewrap CLI de Google
        run: |
          npm install -g @bubblewrap/cli

      - name: Inicializar y Compilar Proyecto TWA Nativo
        run: |
          echo "Generando aplicacion nativa TWA para Paseo Aranjuez..."
          mkdir -p twa-project
          cd twa-project

          # Inicializar proyecto TWA con el manifest de produccion
          bubblewrap init --manifest="https://aranjeuez-xi.vercel.app/manifest.json" --directory="./app"

          cd app
          # Compilar el APK usando Gradle nativo
          ./gradlew assembleRelease || ./gradlew assembleDebug

          echo "APK generado exitosamente."

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: PaseoAranjuez-Android-APK
          path: twa-project/app/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
